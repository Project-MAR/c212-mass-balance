<script>
(function () {
  'use strict';

  /* =====================================================================
   * AIRCRAFT DATA  (all arms in metres aft of datum, weights in kg)
   * Datum: 1.115 m forward of the jig point.  LEMAC 5.462 m, MAC 2.190 m.
   * Lateral position y: metres from centreline, + = right (starboard).
   * ===================================================================== */
  var LEMAC = 5.462, MAC = 2.190, KG2LB = 2.20462;

  var TYPES = {
    C212_300: {
      name: 'C-212-300 – military (normal role)',
      source: 'QRH C-212-300 Rev 4 (Jul 2019) LD-2 Weight Limitations (military normal role, 2.5 g) and LD-4 Center of Gravity (Military). Fuel-tank arms and cargo zones taken from the C-212-400 W&B Manual (same wing and fuselage).',
      limits: { ramp: 8150, mtow: 8100, mlw: 8100, mzfw: 7100, minw: 4300 },
      env: { fwd: [[4300, 15.0], [5013, 15.0], [7700, 16.0], [8100, 16.0]], aft: [[4300, 30.0], [8000, 30.0], [8100, 27.0]] },
      fuel: { inb: { arm: 6.26, max: 1090 }, outb: { arm: 6.17, max: 466 }, uw: null }
    },
    C212_300C: {
      name: 'C-212-300 – civil (AFM)',
      source: 'AFM C-212-DF (D.T.88-2508) Section 1 & Appendix 1. Fuel-tank arms and cargo zones taken from the C-212-400 W&B Manual (same wing and fuselage).',
      limits: { ramp: 7750, mtow: 7700, mlw: 7450, mzfw: 7100, minw: 4300 },
      env: { fwd: [[4300, 15.0], [5013, 15.0], [7700, 16.0]], aft: [[4300, 30.0], [7700, 30.0]] },
      fuel: { inb: { arm: 6.26, max: 1090 }, outb: { arm: 6.17, max: 466 }, uw: null }
    },
    C212_400M: {
      name: 'C-212-400 – military (normal role)',
      source: 'AOM C-212-400M AB73 §1 and C-212-400 Weight & Balance Manual (ME-24) ch. 1-10 / 1-20, military weights approved by CASA.',
      limits: { ramp: 8150, mtow: 8100, mlw: 8100, mzfw: 7500, minw: 4700 },
      env: { fwd: [[4700, 12.0], [6500, 12.0], [7700, 16.0], [8100, 16.0]], aft: [[4700, 30.0], [7700, 30.0], [8100, 27.0]] },
      fuel: { inb: { arm: 6.26, max: 1090 }, outb: { arm: 6.17, max: 470 }, uw: { arm: 5.90, max: 770 } }
    },
    C212_400C: {
      name: 'C-212-400 – FAR 25',
      source: 'C-212-400 Weight & Balance Manual (ME-24) ch. 1-10: FAR 25 performance weights.',
      limits: { ramp: 7750, mtow: 7700, mlw: 7450, mzfw: 7100, minw: 4700 },
      env: { fwd: [[4700, 12.0], [6500, 12.0], [7700, 16.0]], aft: [[4700, 30.0], [7700, 30.0]] },
      fuel: { inb: { arm: 6.26, max: 1090 }, outb: { arm: 6.17, max: 470 }, uw: { arm: 5.90, max: 770 } }
    },
    NC212I: {
      name: 'NC212i (C-212-400i)',
      source: 'AOM NC-212i-400 EE92 Vol II §1 (Table 1-1, Table 1-10) and NC212i WAB ground-school CG table.',
      limits: { ramp: 7750, mtow: 7700, mlw: 7450, mzfw: 7100, minw: 4700 },
      env: { fwd: [[4700, 12.0], [6500, 12.0], [7700, 16.0]], aft: [[4700, 30.0], [7700, 30.0]] },
      fuel: { inb: { arm: 6.26, max: 1090 }, outb: { arm: 6.17, max: 470 }, uw: { arm: 5.90, max: 770 } }
    }
  };

  // Seats / stations (arm from the NC212i seat map & W&B manual; y = layout position)
  var STATIONS = [
    { id: 'PIL', label: 'Pilot seat', arm: 2.050, y: -0.5 },
    { id: 'COP', label: 'Co-pilot seat', arm: 2.050, y: 0.5 },
    { id: 'FE',  label: '3rd crew seat', arm: 2.350, y: 0 },
    { id: 'LAV', label: 'Lavatory', arm: 3.430, y: 0.75 }
  ];
  var SEAT_ARMS = [3.539, 4.017, 4.159, 4.495, 4.637, 4.973, 5.115, 5.451, 5.593, 5.929, 6.071, 6.407,
                   6.549, 6.885, 7.027, 7.363, 7.505, 7.841, 7.983, 8.461, 8.939, 9.275, 9.275];
  var SEAT_RH = [3, 5, 7, 9, 11, 13, 15, 17, 19, 20, 21, 23];
  SEAT_ARMS.forEach(function (a, i) {
    var n = i + 1, rh = SEAT_RH.indexOf(n) >= 0;
    STATIONS.push({ id: 'S' + n, label: 'Cabin seat ' + n + (rh ? ' RH' : ' LH'), arm: a, y: rh ? 0.8 : -0.8, seat: true });
  });
  STATIONS.push({ id: 'CUST', label: 'Free position', arm: null });

  var ZONES = [
    { id: 'I',   frames: 'Fr 9P – Fr 1',  from: 3.300, to: 4.100,  arm: 3.700, max: 560 },
    { id: 'II',  frames: 'Fr 1 – Fr 4',   from: 4.100, to: 5.180,  arm: 4.640, max: 755 },
    { id: 'III', frames: 'Fr 4 – Fr 6',   from: 5.180, to: 5.893,  arm: 5.537, max: 500 },
    { id: 'IV',  frames: 'Fr 6 – Fr 11',  from: 5.893, to: 7.119,  arm: 6.506, max: 860 },
    { id: 'V',   frames: 'Fr 11 – Fr 14', from: 7.119, to: 8.212,  arm: 7.666, max: 765 },
    { id: 'VI',  frames: 'Fr 14 – Fr 17', from: 8.212, to: 9.100,  arm: 8.656, max: 620 },
    { id: 'A',   frames: 'Fr 17 – Fr 21 (ramp)', from: 9.100, to: 10.575, arm: 9.838, max: 400 }
  ];
  var CABIN_FROM = 3.300, CABIN_TO = 10.575;
  var BOX = 0.8;          // drawn size of a chemical box (m)
  var PR = 0.23;      // drawn radius of a person (m)

  var DEFAULT_FLEET = [
    { reg: 'NC212i (example)',   type: 'NC212I',    bew: 4778, arm: 6.042, note: 'Example – replace' },
    { reg: 'C-212-400 (example)', type: 'C212_400M', bew: 4826, arm: 6.008, note: 'Example – replace' },
    { reg: 'C-212-300 (example)', type: 'C212_300',  bew: 4500, arm: 6.000, note: 'Placeholder – replace' }
  ];

  var RAIN = {
    mission: 'Royal Rainmaking',
    people: [
      { role: 'Pilot', w: 80, st: 'PIL' },
      { role: 'Co-pilot', w: 80, st: 'COP' },
      { role: 'Flight engineer', w: 80, st: 'FE' },
      { role: 'Chemical operator 1', w: 80, st: 'S5' },   // zone II, RH 4.637
      { role: 'Chemical operator 2', w: 80, st: 'S6' },   // zone II, LH 4.973
      { role: 'Scientist', w: 80, st: 'S4' }              // zone II, LH 4.495
    ],
    cargo: [
      { name: 'Chemical 1', w: 250, arm: 5.537, y: 0.42 },
      { name: 'Chemical 2', w: 250, arm: 5.537, y: -0.42 },
      { name: 'Chemical 3', w: 250, arm: 6.506, y: 0.42 },
      { name: 'Chemical 4', w: 250, arm: 6.506, y: -0.42 }
    ],
    trip: 900
  };

  var HAS_GAS = typeof google !== 'undefined' && google.script && google.script.run;

  /* ============================== STATE ============================== */
  var fleet = loadFleet();
  var state;

  function loadFleet() {
    if (Array.isArray(window.SERVER_FLEET) && window.SERVER_FLEET.length) return window.SERVER_FLEET;
    try {
      var f = JSON.parse(localStorage.getItem('c212wb.fleet') || 'null');
      if (Array.isArray(f) && f.length) return f;
    } catch (e) {}
    return DEFAULT_FLEET.slice();
  }

  function station(id) {
    for (var i = 0; i < STATIONS.length; i++) if (STATIONS[i].id === id) return STATIONS[i];
    return null;
  }

  function rainState(ac, keep) {
    var t = TYPES[ac.type];
    keep = keep || {};
    return {
      reg: ac.reg, type: ac.type, bew: ac.bew, bewArm: ac.arm,
      date: keep.date || todayIso(), flight: keep.flight || '', pic: keep.pic || '',
      mission: RAIN.mission,
      people: RAIN.people.map(function (p) {
        var s = station(p.st);
        return { role: p.role, w: p.w, st: p.st, arm: s.arm, y: s.y };
      }),
      cargo: RAIN.cargo.map(function (c) { return Object.assign({}, c); }),
      items: [],
      fuel: { inb: t.fuel.inb.max, outb: t.fuel.outb.max, uw: 0 },
      trip: RAIN.trip,
      drop: true,
      unit: keep.unit || 'kg'
    };
  }

  /* ============================ HELPERS ============================== */
  function $(id) { return document.getElementById(id); }
  function num(v) { var n = parseFloat(v); return isFinite(n) ? n : 0; }
  function pct(arm) { return (arm - LEMAC) / MAC * 100; }
  function f0(n) { return Math.round(n).toLocaleString('en-US'); }
  function f1(n) { return (Math.round(n * 10) / 10).toFixed(1); }
  function f3(n) { return n.toFixed(3); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function todayIso() { var d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }
  function toUnit(kg) { return state.unit === 'lb' ? kg * KG2LB : kg; }
  function fromUnit(v) { return state.unit === 'lb' ? v / KG2LB : v; }
  function fuelStr(kg) { return f0(kg) + ' kg / ' + f0(kg * KG2LB) + ' lb'; }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  /** Short tag drawn inside a person's circle: "Pilot" → P, "Co-pilot" → CP, "Chemical operator 1" → CO1. */
  function tagOf(role) {
    var s = String(role || '?').trim();
    var digits = (s.match(/\d+$/) || [''])[0];
    var words = s.replace(/\d+$/, '').split(/[\s\-_]+/).filter(Boolean);
    var t = words.map(function (w) { return w[0].toUpperCase(); }).join('').slice(0, 3 - digits.length);
    return (t || '?') + digits;
  }

  function zoneOf(arm) {
    for (var i = 0; i < ZONES.length; i++) if (arm >= ZONES[i].from && arm < ZONES[i].to) return ZONES[i];
    return arm === CABIN_TO ? ZONES[ZONES.length - 1] : null;
  }

  function interp(pts, w) {
    if (w <= pts[0][0]) return pts[0][1];
    for (var i = 1; i < pts.length; i++) {
      if (w <= pts[i][0]) {
        var a = pts[i - 1], b = pts[i];
        return a[1] + (b[1] - a[1]) * (w - a[0]) / (b[0] - a[0]);
      }
    }
    return pts[pts.length - 1][1];
  }
  function envTop(t) { return t.env.fwd[t.env.fwd.length - 1][0]; }
  function fwdLim(t, w) { return interp(t.env.fwd, w); }
  function aftLim(t, w) { return interp(t.env.aft, w); }

  /** Fuel left in each tank group after burning `burn` kg (underwing → outboard → inboard). */
  function burnFuel(f, burn) {
    var r = { uw: f.uw || 0, outb: f.outb || 0, inb: f.inb || 0 };
    ['uw', 'outb', 'inb'].forEach(function (k) {
      var take = Math.min(r[k], burn);
      r[k] -= take; burn -= take;
    });
    return r;
  }
  function fuelMass(t, f) {
    var w = 0, m = 0;
    ['inb', 'outb', 'uw'].forEach(function (k) {
      if (!t.fuel[k]) return;
      w += f[k] || 0; m += (f[k] || 0) * t.fuel[k].arm;
    });
    return { w: w, m: m };
  }

  /* ============================ CALCULATE ============================ */
  function zoneLoads() {
    var loads = {}, outside = [];
    ZONES.forEach(function (z) { loads[z.id] = 0; });
    state.cargo.forEach(function (c) {
      var z = zoneOf(num(c.arm));
      if (z) loads[z.id] += num(c.w); else if (num(c.w)) outside.push(c);
    });
    return { loads: loads, outside: outside };
  }

  function compute() {
    var t = TYPES[state.type];
    var rows = [], W = 0, M = 0;
    function add(label, w, arm, cls) {
      if (!w) return;
      rows.push({ label: label, w: w, arm: arm, m: w * arm, cls: cls || '' });
      W += w; M += w * arm;
    }
    function sub(label) { rows.push({ label: label, w: W, arm: W ? M / W : 0, m: M, cls: 'sub', cg: W ? pct(M / W) : 0 }); }

    add('Basic empty weight', state.bew, state.bewArm);
    var peopleW = 0;
    state.people.forEach(function (p) { var w = num(p.w); peopleW += w; add(p.role || 'Person', w, num(p.arm)); });
    state.items.forEach(function (it) { add(it.desc || 'Item', num(it.w), num(it.arm)); });
    var payW = 0, payM = 0;
    state.cargo.forEach(function (c) {
      var w = num(c.w), a = num(c.arm), z = zoneOf(a);
      payW += w; payM += w * a;
      add((c.name || 'Chemical') + (z ? ' (zone ' + z.id + ')' : ''), w, a);
    });
    sub('ZERO FUEL WEIGHT');
    var zfw = { w: W, m: M };

    var fuel = { inb: num(state.fuel.inb), outb: num(state.fuel.outb), uw: t.fuel.uw ? num(state.fuel.uw) : 0 };
    add('Fuel – inboard tanks', fuel.inb, t.fuel.inb.arm);
    add('Fuel – outboard tanks', fuel.outb, t.fuel.outb.arm);
    if (t.fuel.uw) add('Fuel – underwing tanks', fuel.uw, t.fuel.uw.arm);
    sub('TAKE-OFF WEIGHT');
    var tow = { w: W, m: M };
    var fuelTot = fuel.inb + fuel.outb + fuel.uw;

    var trip = Math.min(num(state.trip), fuelTot);
    var landFuel = burnFuel(fuel, trip);
    var lf = fuelMass(t, landFuel);
    var full = fuelMass(t, fuel);
    rows.push({ label: 'Trip fuel burned', w: -trip, arm: trip ? (full.m - lf.m) / trip : 0, m: -(full.m - lf.m), cls: 'minus' });
    var lwW = zfw.w + lf.w, lwM = zfw.m + lf.m;
    if (state.drop && payW) {
      rows.push({ label: 'Payload dispensed in flight', w: -payW, arm: payM / payW, m: -payM, cls: 'minus' });
      lwW -= payW; lwM -= payM;
    }
    rows.push({ label: 'LANDING WEIGHT', w: lwW, arm: lwW ? lwM / lwW : 0, m: lwM, cls: 'sub', cg: lwW ? pct(lwM / lwW) : 0 });
    var lw = { w: lwW, m: lwM };

    function trace(baseW, baseM) {
      var pts = [], N = 40;
      for (var k = 0; k <= N; k++) {
        var f = burnFuel(fuel, trip * k / N), fm = fuelMass(t, f);
        var w = baseW + fm.w;
        pts.push([pct((baseM + fm.m) / w), w]);
      }
      return pts;
    }
    var tr1 = trace(zfw.w, zfw.m);
    var tr2 = (state.drop && payW) ? trace(zfw.w - payW, zfw.m - payM) : null;

    function pt(o) { var arm = o.w ? o.m / o.w : 0; return { w: o.w, arm: arm, cg: pct(arm) }; }
    var res = {
      t: t, rows: rows, zfw: pt(zfw), tow: pt(tow), lw: pt(lw), tr1: tr1, tr2: tr2,
      peopleW: peopleW, payW: payW, fuelTot: fuelTot, trip: trip, landFuel: lf.w, issues: [],
      zl: zoneLoads()
    };
    check(res, fuel);
    return res;
  }

  function check(r, fuel) {
    var t = r.t, L = t.limits, I = r.issues, top = envTop(t);
    function bad(m) { I.push({ lvl: 'bad', msg: m }); }
    function warn(m) { I.push({ lvl: 'warn', msg: m }); }

    if (r.zfw.w > L.mzfw) bad('Zero fuel weight ' + f0(r.zfw.w) + ' kg exceeds MZFW ' + f0(L.mzfw) + ' kg by ' + f0(r.zfw.w - L.mzfw) + ' kg.');
    if (r.tow.w > L.mtow) bad('Take-off weight ' + f0(r.tow.w) + ' kg exceeds MTOW ' + f0(L.mtow) + ' kg by ' + f0(r.tow.w - L.mtow) + ' kg.');
    if (r.lw.w > L.mlw) bad('Landing weight ' + f0(r.lw.w) + ' kg exceeds MLW ' + f0(L.mlw) + ' kg by ' + f0(r.lw.w - L.mlw) + ' kg.');
    if (r.lw.w < L.minw) warn('Landing weight is below the minimum flight weight (' + f0(L.minw) + ' kg).');

    [['Zero fuel', r.zfw], ['Take-off', r.tow], ['Landing', r.lw]].forEach(function (x) {
      var p = x[1], w = Math.min(p.w, top), fl = fwdLim(t, w), al = aftLim(t, w);
      if (p.cg < fl - 1e-9) bad(x[0] + ' CG ' + f1(p.cg) + ' %MAC is forward of the limit (' + f1(fl) + ' %MAC).');
      else if (p.cg > al + 1e-9) bad(x[0] + ' CG ' + f1(p.cg) + ' %MAC is aft of the limit (' + f1(al) + ' %MAC).');
      else if (p.cg - fl < 1 || al - p.cg < 1) warn(x[0] + ' CG ' + f1(p.cg) + ' %MAC is within 1 %MAC of a limit.');
    });

    var outTrace = [r.tr1, r.tr2].some(function (tr) {
      return tr && tr.some(function (p) { var w = Math.min(p[1], top); return p[0] < fwdLim(t, w) - 1e-9 || p[0] > aftLim(t, w) + 1e-9; });
    });
    if (outTrace) bad('CG leaves the envelope during the fuel burn – check fuel and load distribution.');

    ZONES.forEach(function (z) {
      var w = r.zl.loads[z.id];
      if (w > z.max) bad('Zone ' + z.id + ' load ' + f0(w) + ' kg exceeds the recommended maximum of ' + f0(z.max) + ' kg.');
    });
    r.zl.outside.forEach(function (c) { warn((c.name || 'Chemical') + ' (arm ' + f3(num(c.arm)) + ' m) is outside the cargo zones.'); });
    ['inb', 'outb', 'uw'].forEach(function (k) {
      if (t.fuel[k] && fuel[k] > t.fuel[k].max + 0.5) bad('Fuel in ' + ({ inb: 'inboard', outb: 'outboard', uw: 'underwing' })[k] + ' tanks exceeds usable capacity (' + f0(t.fuel[k].max) + ' kg).');
    });
    if (fuel.outb > 0 && fuel.inb < t.fuel.inb.max - 1) warn('Inboard tanks should be filled before outboard tanks.');
    if (t.fuel.uw && fuel.uw > 0 && (fuel.inb < t.fuel.inb.max - 1 || fuel.outb < t.fuel.outb.max - 1)) warn('Underwing tanks may only be loaded with full wing tanks.');
    if (num(state.trip) > r.fuelTot) bad('Trip fuel (' + f0(num(state.trip)) + ' kg) is more than the fuel on board.');
    if (r.landFuel < 1 && r.fuelTot > 0 && num(state.trip) > 0) bad('No fuel remaining at landing.');
  }

  /* ============================== CHART ============================== */
  function drawChart(r) {
    var t = r.t, L = t.limits, top = envTop(t);
    var Wd = 720, Ht = 470, ml = 62, mr = 24, mt = 44, mb = 46;
    var pw = Wd - ml - mr, ph = Ht - mt - mb;

    var allX = [r.zfw.cg, r.tow.cg, r.lw.cg], allY = [r.zfw.w, r.tow.w, r.lw.w];
    var xmin = Math.min(8, Math.floor(Math.min.apply(null, allX) / 2) * 2 - 2);
    var xmax = Math.max(34, Math.ceil(Math.max.apply(null, allX) / 2) * 2 + 2);
    var ymin = Math.floor((Math.min(L.minw, Math.min.apply(null, allY)) - 300) / 500) * 500;
    var ymax = Math.ceil((Math.max(top, Math.max.apply(null, allY)) + 250) / 500) * 500;
    function X(v) { return ml + (v - xmin) / (xmax - xmin) * pw; }
    function Y(v) { return mt + (ymax - v) / (ymax - ymin) * ph; }

    var s = [];
    s.push('<svg viewBox="0 0 ' + Wd + ' ' + Ht + '" role="img" aria-label="Weight versus CG envelope chart">');
    s.push('<rect x="' + ml + '" y="' + mt + '" width="' + pw + '" height="' + ph + '" fill="#fff" stroke="#c9d1db"/>');

    for (var gx = Math.ceil(xmin / 2) * 2; gx <= xmax; gx += 2) {
      s.push('<line x1="' + X(gx) + '" x2="' + X(gx) + '" y1="' + mt + '" y2="' + (mt + ph) + '" stroke="var(--grid)"/>');
      s.push('<text x="' + X(gx) + '" y="' + (mt + ph + 16) + '" font-size="11" text-anchor="middle" fill="#4a5666">' + gx + '</text>');
    }
    for (var gy = ymin; gy <= ymax; gy += 500) {
      s.push('<line x1="' + ml + '" x2="' + (ml + pw) + '" y1="' + Y(gy) + '" y2="' + Y(gy) + '" stroke="var(--grid)"/>');
      s.push('<text x="' + (ml - 6) + '" y="' + (Y(gy) + 4) + '" font-size="11" text-anchor="end" fill="#4a5666">' + f0(gy) + '</text>');
    }
    var a0 = Math.ceil((LEMAC + MAC * xmin / 100) * 10) / 10;
    for (var a = a0; pct(a) <= xmax + 1e-9; a = Math.round((a + 0.1) * 10) / 10) {
      var xa = X(pct(a));
      s.push('<line x1="' + xa + '" x2="' + xa + '" y1="' + mt + '" y2="' + (mt - 4) + '" stroke="#7c8796"/>');
      s.push('<text x="' + xa + '" y="' + (mt - 8) + '" font-size="10" text-anchor="middle" fill="#7c8796">' + a.toFixed(1) + '</text>');
    }
    s.push('<text x="' + (ml + pw / 2) + '" y="' + (Ht - 8) + '" font-size="12" text-anchor="middle" fill="#17202b">CG (% MAC)</text>');
    s.push('<text x="' + (ml + pw) + '" y="13" font-size="10" text-anchor="end" fill="#7c8796">Arm from datum (m)</text>');
    s.push('<text transform="translate(14 ' + (mt + ph / 2) + ') rotate(-90)" font-size="12" text-anchor="middle" fill="#17202b">Gross weight (kg)</text>');

    var poly = [];
    t.env.fwd.forEach(function (p) { poly.push(X(p[1]) + ',' + Y(p[0])); });
    t.env.aft.slice().reverse().forEach(function (p) { poly.push(X(p[1]) + ',' + Y(p[0])); });
    s.push('<polygon points="' + poly.join(' ') + '" fill="var(--env)" stroke="var(--env-line)" stroke-width="2"/>');

    function hline(w, label, dash) {
      var x1 = X(fwdLim(t, w)), x2 = X(aftLim(t, w));
      s.push('<line x1="' + x1 + '" x2="' + x2 + '" y1="' + Y(w) + '" y2="' + Y(w) + '" stroke="var(--env-line)" stroke-width="1.4"' + (dash ? ' stroke-dasharray="6 4"' : '') + '/>');
      s.push('<text x="' + (x2 + 6) + '" y="' + (Y(w) + 4) + '" font-size="11" fill="var(--env-line)">' + label + ' ' + f0(w) + '</text>');
    }
    hline(top, 'MTOW', false);
    if (L.mlw < top) hline(L.mlw, 'MLW', true);
    hline(L.mzfw, 'MZFW', true);
    s.push('<text x="' + (X(fwdLim(t, L.minw)) + 4) + '" y="' + (Y(L.minw) + 14) + '" font-size="10" fill="#7c8796">Min flight weight ' + f0(L.minw) + '</text>');

    function path(tr, color, dash) {
      if (!tr) return;
      var d = tr.map(function (p, i) { return (i ? 'L' : 'M') + X(p[0]).toFixed(1) + ' ' + Y(p[1]).toFixed(1); }).join(' ');
      s.push('<path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="2"' + (dash ? ' stroke-dasharray="5 4"' : '') + '/>');
    }
    path(r.tr1, 'var(--tow)', false);
    path(r.tr2, 'var(--lw)', true);

    function marker(p, shape, color, label, dx, dy, anchor) {
      var x = X(p.cg), y = Y(p.w), tag, m;
      if (shape === 'circle') { tag = 'circle'; m = '<circle cx="' + x + '" cy="' + y + '" r="6.5"'; }
      else if (shape === 'square') { tag = 'rect'; m = '<rect x="' + (x - 7) + '" y="' + (y - 7) + '" width="14" height="14" transform="rotate(45 ' + x + ' ' + y + ')"'; }
      else { tag = 'polygon'; m = '<polygon points="' + x + ',' + (y - 8) + ' ' + (x + 7.5) + ',' + (y + 6) + ' ' + (x - 7.5) + ',' + (y + 6) + '"'; }
      s.push('<g>' + m + ' fill="' + color + '" stroke="#fff" stroke-width="2"><title>' + label + ': ' + f0(p.w) + ' kg, ' + f1(p.cg) + ' %MAC (' + f3(p.arm) + ' m)</title></' + tag + '>');
      s.push('<text x="' + (x + dx) + '" y="' + (y + dy) + '" font-size="12" font-weight="700" text-anchor="' + anchor + '" fill="' + color + '" paint-order="stroke" stroke="#fff" stroke-width="3">' + label + '</text>');
      s.push('<text x="' + (x + dx) + '" y="' + (y + dy + 13) + '" font-size="11" text-anchor="' + anchor + '" fill="#17202b" paint-order="stroke" stroke="#fff" stroke-width="3">' + f0(p.w) + ' kg · ' + f1(p.cg) + '%</text>');
      s.push('</g>');
    }
    marker(r.zfw, 'circle', 'var(--zfw)', 'ZFW', -12, 4, 'end');
    marker(r.lw, 'triangle', 'var(--lw)', 'LW', 12, 14, 'start');
    marker(r.tow, 'square', 'var(--tow)', 'TOW', 12, -6, 'start');

    s.push('</svg>');
    $('chart').innerHTML = s.join('');

    $('legend').innerHTML =
      '<span><i style="background:var(--env);border:1.5px solid var(--env-line)"></i>Envelope</span>' +
      '<span><i style="background:var(--tow)"></i>TOW &amp; burn</span>' +
      (r.tr2 ? '<span><i style="background:var(--lw)"></i>After payload release</span>' : '<span><i style="background:var(--lw)"></i>LW</span>') +
      '<span><i style="background:var(--zfw)"></i>ZFW</span>';
  }

  /* ============================ TOP VIEW ============================= */
  // Scale: K px per metre. Nose to the left, starboard (RH, +y) at the top.
  var TV = { K: 56, AMIN: -0.3, AMAX: 16.3, HALF: 3.2, TOP: 56, BOT: 46 };
  TV.W = Math.round((TV.AMAX - TV.AMIN) * TV.K + 32);
  TV.H = Math.round(TV.TOP + 2 * TV.HALF * TV.K + TV.BOT);
  TV.CY = TV.TOP + TV.HALF * TV.K;
  function TX(arm) { return 16 + (arm - TV.AMIN) * TV.K; }
  function TY(y) { return TV.CY - y * TV.K; }
  function armOfX(x) { return (x - 16) / TV.K + TV.AMIN; }
  function yOfY(py) { return (TV.CY - py) / TV.K; }
  function r1(n) { return Math.round(n * 10) / 10; }

  function renderTopView() {
    var s = [], K = TV.K;
    s.push('<svg id="tvsvg" viewBox="0 0 ' + TV.W + ' ' + TV.H + '" role="application" aria-label="Aircraft top view with draggable crew and chemical payload">');
    s.push('<defs><clipPath id="tvclip"><rect x="0" y="' + (TV.TOP - 6) + '" width="' + TV.W + '" height="' + (2 * TV.HALF * K + 12) + '"/></clipPath>' +
      '<pattern id="ramp" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8 L8 0" stroke="#c9d1db" stroke-width="1"/></pattern></defs>');

    // --- arm ruler (top) ---
    s.push('<line x1="' + TX(0) + '" x2="' + TX(16) + '" y1="28" y2="28" stroke="#7c8796"/>');
    for (var a = 0; a <= 16.001; a += 0.5) {
      var major = Math.abs(a - Math.round(a)) < 1e-6;
      s.push('<line x1="' + TX(a) + '" x2="' + TX(a) + '" y1="28" y2="' + (major ? 36 : 32) + '" stroke="#7c8796"/>');
      if (major) s.push('<text x="' + TX(a) + '" y="22" font-size="11" text-anchor="middle" fill="#4a5666">' + a + '</text>');
    }
    s.push('<text x="' + TX(16.25) + '" y="22" font-size="11" fill="#4a5666">m</text>');
    s.push('<text x="' + TX(0) + '" y="48" font-size="10" fill="#7c8796" text-anchor="start">↑ datum (0 m)</text>');

    s.push('<g clip-path="url(#tvclip)">');
    // horizontal tail and wings (behind fuselage)
    s.push('<polygon points="' + TX(13.3) + ',' + TY(4.2) + ' ' + TX(14.4) + ',' + TY(4.2) + ' ' + TX(15.4) + ',' + TY(0.4) + ' ' + TX(15.4) + ',' + TY(-0.4) + ' ' + TX(14.4) + ',' + TY(-4.2) + ' ' + TX(13.3) + ',' + TY(-4.2) + '" fill="#eef1f5" stroke="#aab4c0"/>');
    s.push('<rect x="' + TX(5.30) + '" y="' + TY(9.5) + '" width="' + (2.5 * K) + '" height="' + (19 * K) + '" fill="#eef1f5" stroke="#aab4c0"/>');
    // nacelles & propellers
    [2.75, -2.75].forEach(function (yy) {
      s.push('<rect x="' + TX(3.75) + '" y="' + TY(yy + 0.45) + '" width="' + (4.2 * K) + '" height="' + (0.9 * K) + '" rx="' + (0.4 * K) + '" fill="#e2e7ee" stroke="#9aa5b2"/>');
      s.push('<line x1="' + TX(3.6) + '" x2="' + TX(3.6) + '" y1="' + TY(yy + 1.397) + '" y2="' + TY(yy - 1.397) + '" stroke="#9aa5b2" stroke-width="3" stroke-linecap="round"/>');
    });
    // fuselage outline
    var prof = [[0.35, 0], [0.55, 0.42], [0.95, 0.72], [1.5, 0.95], [2.3, 1.1], [3.0, 1.15], [9.4, 1.15], [10.6, 1.05], [12.4, 0.78], [14.4, 0.48], [15.5, 0.3], [15.6, 0]];
    var pts = prof.map(function (p) { return TX(p[0]) + ',' + TY(p[1]); })
      .concat(prof.slice().reverse().map(function (p) { return TX(p[0]) + ',' + TY(-p[1]); }));
    s.push('<polygon points="' + pts.join(' ') + '" fill="#f8fafc" stroke="#5b6675" stroke-width="1.6"/>');
    // cockpit windscreen hint
    s.push('<path d="M' + TX(1.25) + ' ' + TY(0.85) + ' Q' + TX(0.95) + ' ' + TY(0) + ' ' + TX(1.25) + ' ' + TY(-0.85) + '" fill="none" stroke="#9aa5b2" stroke-width="2"/>');
    s.push('<text x="' + TX(1.0) + '" y="' + (TY(0) + 4) + '" font-size="10" fill="#7c8796" text-anchor="middle" transform="rotate(-90 ' + TX(1.0) + ' ' + (TY(0) + 4) + ')">COCKPIT</text>');
    s.push('<line x1="' + TX(CABIN_FROM) + '" x2="' + TX(CABIN_FROM) + '" y1="' + TY(1.15) + '" y2="' + TY(-1.15) + '" stroke="#5b6675" stroke-dasharray="4 3"/>');

    // cargo zones
    ZONES.forEach(function (z, i) {
      s.push('<rect class="zone" data-z="' + z.id + '" x="' + TX(z.from) + '" y="' + TY(1.1) + '" width="' + ((z.to - z.from) * K) + '" height="' + (2.2 * K) + '" fill="' + (z.id === 'A' ? 'url(#ramp)' : (i % 2 ? '#eaf1fb' : '#f3f7fc')) + '"/>');
      s.push('<line x1="' + TX(z.to) + '" x2="' + TX(z.to) + '" y1="' + TY(1.1) + '" y2="' + TY(-1.1) + '" stroke="#b9c6d6" stroke-dasharray="3 3"/>');
      var cx = TX((z.from + z.to) / 2);
      s.push('<text x="' + cx + '" y="' + (TY(1.15) - 5) + '" font-size="12" font-weight="700" text-anchor="middle" fill="#1f5fae"><title>Zone ' + z.id + ': ' + z.frames + ', ' + z.from.toFixed(3) + '–' + z.to.toFixed(3) + ' m, max ' + z.max + ' kg</title>' + (z.id === 'A' ? 'A ramp' : z.id) + '</text>');
      s.push('<text x="' + cx + '" y="' + (TY(-1.15) + 13) + '" font-size="10" text-anchor="middle" fill="#4a5666">' + z.arm.toFixed(3) + '</text>');
    });
    s.push('<text x="' + (TX(CABIN_FROM) - 6) + '" y="' + (TY(1.15) - 5) + '" font-size="10" text-anchor="end" fill="#7c8796">Zone</text>');
    s.push('<text x="' + TX(2.0) + '" y="' + (TY(-1.15) + 13) + '" font-size="10" text-anchor="middle" fill="#4a5666">Crew 2.050 / 2.350</text>');

    // seats
    STATIONS.forEach(function (st) {
      if (st.arm == null || st.id === 'LAV') return;
      var w = st.seat ? 0.36 : 0.44, h = st.seat ? 0.34 : 0.44;
      s.push('<rect x="' + (TX(st.arm) - w * K / 2) + '" y="' + (TY(st.y) - h * K / 2) + '" width="' + (w * K) + '" height="' + (h * K) + '" rx="3" fill="none" stroke="#c3ccd8"><title>' + st.label + ' – ' + st.arm.toFixed(3) + ' m</title></rect>');
    });

    // CG markers sit under the labels and the draggable items
    s.push('<g id="tvCg"></g>');
    // wing labels: MAC bar and fuel tanks
    var macY = -2.15;
    s.push('<text x="' + TX(6.55) + '" y="' + (TY(1.6) + 4) + '" font-size="10" text-anchor="middle" fill="#4a5666" paint-order="stroke" stroke="#eef1f5" stroke-width="4">Wing fuel 6.17 / 6.26 m · underwing 5.90 m</text>');
    s.push('<rect x="' + TX(LEMAC) + '" y="' + (TY(macY) - 5) + '" width="' + (MAC * K) + '" height="10" fill="#fff" stroke="#5b6675"/>');
    s.push('<g id="tvLimits"></g>');
    for (var p = 0; p <= 100.001; p += 10) {
      var xx = TX(LEMAC + MAC * p / 100);
      s.push('<line x1="' + xx + '" x2="' + xx + '" y1="' + (TY(macY) - 5) + '" y2="' + (TY(macY) + (p % 50 === 0 ? 9 : 6)) + '" stroke="#5b6675"/>');
    }
    s.push('<text x="' + TX(LEMAC) + '" y="' + (TY(macY) + 20) + '" font-size="9" text-anchor="middle" fill="#4a5666">0% · 5.462</text>');
    s.push('<text x="' + TX(LEMAC + MAC) + '" y="' + (TY(macY) + 20) + '" font-size="9" text-anchor="middle" fill="#4a5666">100% · 7.652</text>');
    s.push('<text x="' + TX(LEMAC + MAC / 2) + '" y="' + (TY(macY) - 10) + '" font-size="10" text-anchor="middle" font-weight="700" fill="#4a5666">MAC 2.190 m</text>');
    s.push('</g>');

    // section boundaries ruler (bottom)
    var by = TV.H - 26;
    s.push('<line x1="' + TX(CABIN_FROM) + '" x2="' + TX(CABIN_TO) + '" y1="' + by + '" y2="' + by + '" stroke="#7c8796"/>');
    [CABIN_FROM].concat(ZONES.map(function (z) { return z.to; })).forEach(function (b) {
      s.push('<line x1="' + TX(b) + '" x2="' + TX(b) + '" y1="' + (by - 5) + '" y2="' + (by + 5) + '" stroke="#7c8796"/>');
      s.push('<text x="' + TX(b) + '" y="' + (by + 17) + '" font-size="10" text-anchor="middle" fill="#4a5666">' + b.toFixed(3) + '</text>');
    });
    s.push('<text x="' + (TX(CABIN_FROM) - 8) + '" y="' + (by + 4) + '" font-size="10" text-anchor="end" fill="#7c8796">Zone boundaries (m)</text>');

    // dynamic layers
    s.push('<g id="tvItems"></g>');
    s.push('<text id="tvRead" x="0" y="0" font-size="12" font-weight="700" fill="#17202b" paint-order="stroke" stroke="#fff" stroke-width="4" visibility="hidden"></text>');
    s.push('</svg>');
    $('topview').innerHTML = s.join('');
    renderTopItems();
  }

  function itemTitle(kind, it) {
    return kind === 'p'
      ? esc(it.role) + ' – ' + f0(num(it.w)) + ' kg at ' + f3(num(it.arm)) + ' m'
      : esc(it.name) + ' – ' + f0(num(it.w)) + ' kg at ' + f3(num(it.arm)) + ' m';
  }

  function renderTopItems() {
    var s = [], K = TV.K;
    state.cargo.forEach(function (c, i) {
      var h = BOX * K / 2;
      s.push('<g class="dr" data-kind="c" data-i="' + i + '" tabindex="0" transform="translate(' + r1(TX(num(c.arm))) + ' ' + r1(TY(num(c.y))) + ')">' +
        '<title>' + itemTitle('c', c) + '</title>' +
        '<rect class="shape" x="' + (-h) + '" y="' + (-h) + '" width="' + (2 * h) + '" height="' + (2 * h) + '" rx="3" fill="#f59e0b" fill-opacity=".9" stroke="#b45309" stroke-width="1.5"/>' +
        '<line x1="' + (-h) + '" y1="' + (-h) + '" x2="' + h + '" y2="' + h + '" stroke="#b45309" stroke-opacity=".35"/>' +
        '<line x1="' + h + '" y1="' + (-h) + '" x2="' + (-h) + '" y2="' + h + '" stroke="#b45309" stroke-opacity=".35"/>' +
        '<text y="-2" font-size="12" font-weight="700" text-anchor="middle" fill="#3b2300" paint-order="stroke" stroke="#fbbf24" stroke-width="3">' + f0(num(c.w)) + '</text>' +
        '<text y="11" font-size="9" text-anchor="middle" fill="#3b2300">kg</text></g>');
    });
    state.people.forEach(function (p, i) {
      s.push('<g class="dr" data-kind="p" data-i="' + i + '" tabindex="0" transform="translate(' + r1(TX(num(p.arm))) + ' ' + r1(TY(num(p.y))) + ')">' +
        '<title>' + itemTitle('p', p) + '</title>' +
        '<circle class="shape" r="' + (PR * K) + '" fill="#2563eb" stroke="#1e3a8a" stroke-width="1.5"/>' +
        '<text y="4" font-size="11" font-weight="700" text-anchor="middle" fill="#fff">' + esc(tagOf(p.role)) + '</text></g>');
    });
    $('tvItems').innerHTML = s.join('');
  }

  function updateTopDynamic(r) {
    var K = TV.K, s = [];
    // TOW CG line through the fuselage + ZFW / LW markers
    function cgMark(p, color, label, yTop, solid) {
      var x = TX(p.arm);
      s.push('<line x1="' + x + '" x2="' + x + '" y1="' + TY(1.95) + '" y2="' + TY(-2.45) + '" stroke="' + color + '" stroke-width="' + (solid ? 2.5 : 1.5) + '"' + (solid ? '' : ' stroke-dasharray="4 3"') + '/>');
      s.push('<path d="M' + (x - 6) + ' ' + (TY(-2.45) + 9) + ' L' + (x + 6) + ' ' + (TY(-2.45) + 9) + ' L' + x + ' ' + (TY(-2.45) - 1) + 'z" fill="' + color + '"/>');
      if (label) s.push('<text x="' + x + '" y="' + yTop + '" font-size="11" font-weight="700" text-anchor="middle" fill="' + color + '" paint-order="stroke" stroke="#fff" stroke-width="3">' + label + '</text>');
    }
    cgMark(r.zfw, 'var(--zfw)', '', 0, false);
    cgMark(r.lw, 'var(--lw)', '', 0, false);
    cgMark(r.tow, 'var(--tow)', 'TOW CG ' + f3(r.tow.arm) + ' m · ' + f1(r.tow.cg) + '% MAC', TY(1.95) - 5, true);
    $('tvCg').innerHTML = s.join('');

    // CG limits at take-off weight on the MAC bar
    var t = r.t, w = Math.min(r.tow.w, envTop(t)), fl = fwdLim(t, w), al = aftLim(t, w), my = TY(-2.15);
    var x1 = TX(LEMAC + MAC * fl / 100), x2 = TX(LEMAC + MAC * al / 100);
    $('tvLimits').innerHTML = '<rect x="' + x1 + '" y="' + (my - 5) + '" width="' + (x2 - x1) + '" height="10" fill="#bbf7d0"><title>Allowed CG at take-off weight: ' + f1(fl) + '–' + f1(al) + ' %MAC</title></rect>';

    // zone overload tint
    document.querySelectorAll('#tvsvg .zone').forEach(function (el) {
      var z = el.getAttribute('data-z'), zz = ZONES.filter(function (q) { return q.id === z; })[0];
      el.style.fill = r.zl.loads[z] > zz.max ? '#fde2e0' : '';
    });
  }

  /* ---------- drag & keyboard ---------- */
  var drag = null;
  function svgPoint(svg, e) {
    var p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
    return p.matrixTransform(svg.getScreenCTM().inverse());
  }
  function itemOf(g) { return g.getAttribute('data-kind') === 'p' ? state.people[+g.getAttribute('data-i')] : state.cargo[+g.getAttribute('data-i')]; }

  function placeItem(g, it, arm, y) {
    var kind = g.getAttribute('data-kind');
    if (kind === 'p') {
      arm = clamp(arm, 1.75, CABIN_TO - 0.15); y = clamp(y, -0.95, 0.95);
      if (it.st !== 'CUST') it.st = 'CUST';
    } else {
      arm = clamp(arm, CABIN_FROM, CABIN_TO); y = clamp(y, -1.1 + BOX / 2, 1.1 - BOX / 2);
    }
    it.arm = Math.round(arm * 1000) / 1000; it.y = Math.round(y * 100) / 100;
    g.setAttribute('transform', 'translate(' + r1(TX(it.arm)) + ' ' + r1(TY(it.y)) + ')');
    g.querySelector('title').textContent = itemTitle(kind, it).replace(/&amp;/g, '&');
    var rd = $('tvRead');
    rd.textContent = (kind === 'p' ? tagOf(it.role) : it.name) + ' · ' + f3(it.arm) + ' m' + (kind === 'c' ? ' · zone ' + ((zoneOf(it.arm) || {}).id || '–') : '');
    rd.setAttribute('x', TX(it.arm) + 20); rd.setAttribute('y', TY(it.y) - 20);
    rd.setAttribute('visibility', 'visible');
    syncRowInputs(kind, +g.getAttribute('data-i'));
    recalc();
  }

  function bindTopView() {
    var host = $('topview');
    host.addEventListener('pointerdown', function (e) {
      var g = e.target.closest('g.dr'); if (!g) return;
      e.preventDefault();
      var svg = $('tvsvg'), pt = svgPoint(svg, e), it = itemOf(g);
      drag = { g: g, id: e.pointerId, dArm: num(it.arm) - armOfX(pt.x), dY: num(it.y) - yOfY(pt.y) };
      g.setPointerCapture(e.pointerId);
      g.classList.add('dragging');
      g.parentNode.appendChild(g);  // bring to front
      g.focus({ preventScroll: true });
      highlightRow(g);
    });
    host.addEventListener('pointermove', function (e) {
      if (!drag || e.pointerId !== drag.id) return;
      var pt = svgPoint($('tvsvg'), e);
      placeItem(drag.g, itemOf(drag.g), armOfX(pt.x) + drag.dArm, yOfY(pt.y) + drag.dY);
    });
    function end(e) {
      if (!drag || e.pointerId !== drag.id) return;
      drag.g.classList.remove('dragging');
      drag = null;
      $('tvRead').setAttribute('visibility', 'hidden');
      renderPeopleStations();
    }
    host.addEventListener('pointerup', end);
    host.addEventListener('pointercancel', end);
    host.addEventListener('keydown', function (e) {
      var g = e.target.closest && e.target.closest('g.dr'); if (!g) return;
      var step = e.shiftKey ? 0.01 : 0.05, it = itemOf(g), da = 0, dy = 0;
      if (e.key === 'ArrowLeft') da = -step; else if (e.key === 'ArrowRight') da = step;
      else if (e.key === 'ArrowUp') dy = step; else if (e.key === 'ArrowDown') dy = -step; else return;
      e.preventDefault();
      placeItem(g, it, num(it.arm) + da, num(it.y) + dy);
      renderPeopleStations();
    });
    host.addEventListener('focusout', function () { $('tvRead').setAttribute('visibility', 'hidden'); });
    host.addEventListener('focusin', function (e) { var g = e.target.closest && e.target.closest('g.dr'); if (g) highlightRow(g); });
  }

  function highlightRow(g) {
    document.querySelectorAll('#tblPeople tr.hl, #tblCargo tr.hl').forEach(function (tr) { tr.classList.remove('hl'); });
    var tb = g.getAttribute('data-kind') === 'p' ? $('tblPeople') : $('tblCargo');
    var tr = tb.tBodies[0].rows[+g.getAttribute('data-i')];
    if (tr) tr.classList.add('hl');
  }

  /** Update the arm input of a table row without rebuilding the table (keeps focus). */
  function syncRowInputs(kind, i) {
    var tb = kind === 'p' ? $('tblPeople') : $('tblCargo');
    var tr = tb.tBodies[0].rows[i]; if (!tr) return;
    var it = kind === 'p' ? state.people[i] : state.cargo[i];
    var inp = tr.querySelector('input[data-k=arm]');
    if (inp && document.activeElement !== inp) inp.value = f3(num(it.arm));
    var zc = tr.querySelector('.zc');
    if (zc) { var z = zoneOf(num(it.arm)); zc.textContent = z ? z.id : 'outside'; }
  }
  function renderPeopleStations() {
    state.people.forEach(function (p, i) {
      var tr = $('tblPeople').tBodies[0].rows[i]; if (!tr) return;
      var sel = tr.querySelector('select[data-k=st]'); if (sel && sel.value !== p.st) sel.value = p.st;
    });
  }

  /* ============================ RENDER =============================== */
  function renderAll() {
    renderSelectors();
    renderHeaderInputs();
    renderPeople();
    renderCargo();
    renderItems();
    renderFuel();
    renderTopView();
    recalc();
  }

  function renderSelectors() {
    $('selReg').innerHTML = fleet.map(function (a, i) {
      return '<option value="' + i + '"' + (a.reg === state.reg ? ' selected' : '') + '>' + esc(a.reg) + '</option>';
    }).join('');
    $('selType').innerHTML = Object.keys(TYPES).map(function (k) {
      return '<option value="' + k + '"' + (k === state.type ? ' selected' : '') + '>' + esc(TYPES[k].name) + '</option>';
    }).join('');
    var L = TYPES[state.type].limits;
    $('typeSource').textContent = 'Limits: MTOW ' + f0(L.mtow) + ' · MLW ' + f0(L.mlw) + ' · MZFW ' + f0(L.mzfw) + ' · min ' + f0(L.minw) + ' kg. Source: ' + TYPES[state.type].source;
  }

  function renderHeaderInputs() {
    $('inDate').value = state.date;
    $('inFlight').value = state.flight;
    $('inMission').value = state.mission;
    $('inPic').value = state.pic;
    $('inBew').value = state.bew;
    $('inBewArm').value = state.bewArm;
    $('chkDrop').checked = !!state.drop;
    document.querySelectorAll('input[name=fuelUnit]').forEach(function (r) { r.checked = r.value === state.unit; });
  }

  function stationOptions(sel) {
    return STATIONS.map(function (s) {
      return '<option value="' + s.id + '"' + (s.id === sel ? ' selected' : '') + '>' + s.label + (s.arm ? ' (' + s.arm.toFixed(3) + ')' : '') + '</option>';
    }).join('');
  }

  function renderPeople() {
    $('tblPeople').tBodies[0].innerHTML = state.people.map(function (p, i) {
      return '<tr data-i="' + i + '">' +
        '<td><div class="namecell"><span class="tag p">' + esc(tagOf(p.role)) + '</span><input type="text" data-k="role" value="' + esc(p.role) + '"></div></td>' +
        '<td class="w-kg"><input type="number" data-k="w" step="1" min="0" value="' + p.w + '"></td>' +
        '<td><select data-k="st">' + stationOptions(p.st) + '</select></td>' +
        '<td class="w-arm"><input type="number" data-k="arm" step="0.01" value="' + f3(num(p.arm)) + '"></td>' +
        '<td><button type="button" class="icon no-print" data-del="' + i + '" title="Remove">×</button></td></tr>';
    }).join('');
  }

  function renderCargo() {
    $('tblCargo').tBodies[0].innerHTML = state.cargo.length ? state.cargo.map(function (c, i) {
      var z = zoneOf(num(c.arm));
      return '<tr data-i="' + i + '">' +
        '<td><div class="namecell"><span class="tag b">■</span><input type="text" data-k="name" value="' + esc(c.name) + '"></div></td>' +
        '<td class="w-kg"><input type="number" data-k="w" step="10" min="0" value="' + c.w + '"></td>' +
        '<td class="w-arm"><input type="number" data-k="arm" step="0.01" value="' + f3(num(c.arm)) + '"></td>' +
        '<td class="zc">' + (z ? z.id : 'outside') + '</td>' +
        '<td><button type="button" class="icon no-print" data-del="' + i + '" title="Remove">×</button></td></tr>';
    }).join('') : '<tr><td colspan="5" class="muted">No payload</td></tr>';
  }

  function renderZones(r) {
    $('tblZones').tBodies[0].innerHTML = ZONES.map(function (z) {
      var w = r.zl.loads[z.id];
      return '<tr' + (w > z.max ? ' class="hl"' : '') + '><td><b>' + z.id + '</b></td><td class="muted">' + z.from.toFixed(3) + ' – ' + z.to.toFixed(3) + '</td><td class="r">' + z.arm.toFixed(3) +
        '</td><td class="r muted">' + z.max + '</td><td class="r"' + (w > z.max ? ' style="color:var(--bad);font-weight:700"' : '') + '>' + (w ? f0(w) : '–') + '</td></tr>';
    }).join('');
  }

  function renderItems() {
    var tb = $('tblItems').tBodies[0];
    tb.innerHTML = state.items.length ? state.items.map(function (it, i) {
      return '<tr data-i="' + i + '"><td><input type="text" data-k="desc" value="' + esc(it.desc) + '"></td>' +
        '<td class="w-kg"><input type="number" data-k="w" step="1" value="' + it.w + '"></td>' +
        '<td class="w-arm"><input type="number" data-k="arm" step="0.001" value="' + it.arm + '"></td>' +
        '<td><button type="button" class="icon no-print" data-del="' + i + '" title="Remove">×</button></td></tr>';
    }).join('') : '<tr><td colspan="4" class="muted">None</td></tr>';
  }

  function renderFuel() {
    var t = TYPES[state.type], u = state.unit;
    var rows = [['inb', 'Inboard'], ['outb', 'Outboard'], ['uw', 'Underwing (optional)']];
    $('tblFuel').tBodies[0].innerHTML = rows.filter(function (r) { return t.fuel[r[0]]; }).map(function (r) {
      var d = t.fuel[r[0]];
      return '<tr><td>' + r[1] + '</td><td class="r">' + d.arm.toFixed(2) + '</td><td class="r muted">' + f0(toUnit(d.max)) + ' ' + u +
        '</td><td class="w-kg"><input type="number" data-fuel="' + r[0] + '" step="' + (u === 'lb' ? 10 : 5) + '" min="0" value="' + Math.round(toUnit(num(state.fuel[r[0]]))) + '"></td></tr>';
    }).join('');
    $('inTrip').value = Math.round(toUnit(num(state.trip)));
    document.querySelectorAll('.fu').forEach(function (e) { e.textContent = u; });
  }

  var lastResult = null;
  function recalc() {
    var r = compute();
    lastResult = r;
    var L = r.t.limits;

    $('outBewCg').textContent = f1(pct(state.bewArm)) + ' %MAC';
    $('outPeople').textContent = f0(r.peopleW);
    $('outPayload').textContent = f0(r.payW);
    $('outLandFuel').textContent = fuelStr(r.landFuel);

    function kpi(id, p, maxW, maxLabel, prefix) {
      var el = $(id), out = r.issues.some(function (i) { return i.lvl === 'bad' && i.msg.indexOf(prefix) === 0; });
      el.classList.toggle('out', out);
      el.querySelector('.kv').textContent = f0(p.w) + ' kg';
      el.querySelector('.kc').textContent = f1(p.cg) + ' % MAC';
      el.querySelector('.km').textContent = 'Arm ' + f3(p.arm) + ' m · ' + maxLabel + ' ' + f0(maxW) + ' (margin ' + f0(maxW - p.w) + ' kg)';
    }
    kpi('kZfw', r.zfw, L.mzfw, 'MZFW', 'Zero fuel');
    kpi('kTow', r.tow, L.mtow, 'MTOW', 'Take-off');
    kpi('kLw', r.lw, L.mlw, 'MLW', 'Landing');

    var nBad = r.issues.filter(function (i) { return i.lvl === 'bad'; }).length;
    var nWarn = r.issues.length - nBad;
    var sb = $('statusBanner');
    sb.className = 'status ' + (nBad ? 'bad' : nWarn ? 'warn' : 'ok');
    sb.textContent = nBad ? '✖ OUTSIDE LIMITS – ' + nBad + ' item' + (nBad > 1 ? 's' : '') + ' to correct'
      : nWarn ? '⚠ WITHIN LIMITS – ' + nWarn + ' caution' + (nWarn > 1 ? 's' : '')
      : '✔ WITHIN LIMITS – weight and CG inside the envelope throughout the flight';

    $('warnings').innerHTML = r.issues.map(function (i) { return '<li class="' + i.lvl + '">' + esc(i.msg) + '</li>'; }).join('') +
      '<li class="info">Fuel on board ' + fuelStr(r.fuelTot) + ' · Trip ' + fuelStr(r.trip) + ' · Remaining at landing ' + fuelStr(r.landFuel) + '</li>';

    $('tblSheet').tBodies[0].innerHTML = r.rows.map(function (row) {
      return '<tr class="' + row.cls + '"><td>' + esc(row.label) + '</td><td class="r">' + f0(row.w) + '</td><td class="r">' + (row.w ? f3(row.arm) : '') +
        '</td><td class="r">' + f0(row.m) + '</td><td class="r">' + (row.cls === 'sub' ? f1(row.cg) : '') + '</td></tr>';
    }).join('');

    document.querySelectorAll('[data-fuel]').forEach(function (inp) {
      var d = r.t.fuel[inp.dataset.fuel];
      inp.classList.toggle('bad', num(state.fuel[inp.dataset.fuel]) > d.max + 0.5);
    });

    renderZones(r);
    drawChart(r);
    if ($('tvsvg')) updateTopDynamic(r);
  }

  /* ============================ EVENTS =============================== */
  function bind() {
    $('selReg').addEventListener('change', function () {
      var ac = fleet[+this.value];
      state.reg = ac.reg; state.type = ac.type; state.bew = ac.bew; state.bewArm = ac.arm;
      clampFuel();
      renderAll();
    });
    $('selType').addEventListener('change', function () { state.type = this.value; clampFuel(); renderAll(); });
    $('inDate').addEventListener('input', function () { state.date = this.value; });
    $('inFlight').addEventListener('input', function () { state.flight = this.value; });
    $('inMission').addEventListener('input', function () { state.mission = this.value; });
    $('inPic').addEventListener('input', function () { state.pic = this.value; });
    $('inBew').addEventListener('input', function () { state.bew = num(this.value); recalc(); });
    $('inBewArm').addEventListener('input', function () { state.bewArm = num(this.value); recalc(); });
    $('chkDrop').addEventListener('change', function () { state.drop = this.checked; recalc(); });
    $('inTrip').addEventListener('input', function () { state.trip = fromUnit(num(this.value)); recalc(); });

    // people
    var tp = $('tblPeople');
    tp.addEventListener('input', function (e) {
      var tr = e.target.closest('tr'), k = e.target.dataset.k; if (!tr || !k || k === 'st') return;
      var i = +tr.dataset.i, p = state.people[i];
      if (k === 'role') { p.role = e.target.value; tr.querySelector('.tag').textContent = tagOf(p.role); renderTopItems(); }
      else if (k === 'w') { p.w = num(e.target.value); renderTopItems(); }
      else if (k === 'arm') { p.arm = num(e.target.value); p.st = 'CUST'; tr.querySelector('select').value = 'CUST'; renderTopItems(); }
      recalc();
    });
    tp.addEventListener('change', function (e) {
      if (e.target.dataset.k !== 'st') return;
      var i = +e.target.closest('tr').dataset.i, p = state.people[i], st = station(e.target.value);
      p.st = e.target.value;
      if (st && st.arm != null) { p.arm = st.arm; p.y = st.y; }
      syncRowInputs('p', i); renderTopItems(); recalc();
    });
    tp.addEventListener('click', function (e) {
      if (e.target.dataset.del == null) return;
      state.people.splice(+e.target.dataset.del, 1); renderPeople(); renderTopItems(); recalc();
    });
    $('btnAddPerson').addEventListener('click', function () {
      var used = state.people.map(function (p) { return p.st; });
      var free = STATIONS.filter(function (s) { return s.seat && used.indexOf(s.id) < 0; })[0] || station('S1');
      state.people.push({ role: 'Passenger ' + (state.people.length + 1), w: 80, st: free.id, arm: free.arm, y: free.y });
      renderPeople(); renderTopItems(); recalc();
    });

    // chemical boxes
    var tc = $('tblCargo');
    tc.addEventListener('input', function (e) {
      var tr = e.target.closest('tr'), k = e.target.dataset.k; if (!tr || !k) return;
      var i = +tr.dataset.i, c = state.cargo[i];
      if (k === 'name') c.name = e.target.value;
      else if (k === 'w') c.w = num(e.target.value);
      else if (k === 'arm') { c.arm = num(e.target.value); syncRowInputs('c', i); }
      renderTopItems(); recalc();
    });
    tc.addEventListener('click', function (e) {
      if (e.target.dataset.del == null) return;
      state.cargo.splice(+e.target.dataset.del, 1); renderCargo(); renderTopItems(); recalc();
    });
    $('btnAddBox').addEventListener('click', function () {
      var n = state.cargo.length + 1;
      state.cargo.push({ name: 'Chemical ' + n, w: 250, arm: 7.666, y: 0 });
      renderCargo(); renderTopItems(); recalc();
    });

    // other items
    var ti = $('tblItems');
    ti.addEventListener('input', function (e) {
      var tr = e.target.closest('tr'), k = e.target.dataset.k; if (!tr || !k) return;
      var it = state.items[+tr.dataset.i];
      it[k] = k === 'desc' ? e.target.value : num(e.target.value);
      recalc();
    });
    ti.addEventListener('click', function (e) {
      if (e.target.dataset.del == null) return;
      state.items.splice(+e.target.dataset.del, 1); renderItems(); recalc();
    });
    $('btnAddItem').addEventListener('click', function () {
      state.items.push({ desc: 'Equipment', w: 0, arm: 6.0 }); renderItems(); recalc();
    });

    // fuel
    $('tblFuel').addEventListener('input', function (e) {
      var k = e.target.dataset.fuel; if (!k) return;
      state.fuel[k] = fromUnit(num(e.target.value)); recalc();
    });
    document.querySelectorAll('input[name=fuelUnit]').forEach(function (r) {
      r.addEventListener('change', function () { state.unit = this.value; renderFuel(); recalc(); });
    });
    $('btnFull').addEventListener('click', function () {
      var t = TYPES[state.type];
      state.fuel.inb = t.fuel.inb.max; state.fuel.outb = t.fuel.outb.max;
      renderFuel(); recalc();
    });

    $('btnDefault').addEventListener('click', function () {
      var ac = { reg: state.reg, type: state.type, bew: state.bew, arm: state.bewArm };
      state = rainState(ac, state);
      renderAll();
      toast('Rainmaking default loaded: 6 persons (480 kg), 1000 kg chemical payload, full wing tanks.');
    });
    $('btnPrint').addEventListener('click', function () { window.print(); });
    $('btnSave').addEventListener('click', saveLog);
    $('btnFleet').addEventListener('click', openFleet);
    $('btnFleetCancel').addEventListener('click', function () { $('fleetModal').hidden = true; });
    $('btnFleetAdd').addEventListener('click', function () {
      fleetDraft.push({ reg: '', type: 'NC212I', bew: 4800, arm: 6.0, note: '' }); renderFleet();
    });
    $('btnFleetSave').addEventListener('click', saveFleet);
    $('tblFleet').addEventListener('input', function (e) {
      var tr = e.target.closest('tr'), k = e.target.dataset.k; if (!tr || !k) return;
      fleetDraft[+tr.dataset.i][k] = (k === 'bew' || k === 'arm') ? num(e.target.value) : e.target.value;
    });
    $('tblFleet').addEventListener('click', function (e) {
      if (e.target.dataset.del == null) return;
      fleetDraft.splice(+e.target.dataset.del, 1); renderFleet();
    });

    bindTopView();
  }

  function clampFuel() {
    var t = TYPES[state.type];
    state.fuel.inb = Math.min(num(state.fuel.inb), t.fuel.inb.max);
    state.fuel.outb = Math.min(num(state.fuel.outb), t.fuel.outb.max);
    state.fuel.uw = t.fuel.uw ? Math.min(num(state.fuel.uw), t.fuel.uw.max) : 0;
  }

  /* ============================ FLEET ================================ */
  var fleetDraft = [];
  function openFleet() {
    fleetDraft = fleet.map(function (a) { return Object.assign({}, a); });
    $('fleetMsg').textContent = '';
    renderFleet();
    $('fleetModal').hidden = false;
  }
  function renderFleet() {
    $('tblFleet').tBodies[0].innerHTML = fleetDraft.map(function (a, i) {
      return '<tr data-i="' + i + '"><td><input type="text" data-k="reg" value="' + esc(a.reg) + '"></td>' +
        '<td><select data-k="type">' + Object.keys(TYPES).map(function (k) { return '<option value="' + k + '"' + (k === a.type ? ' selected' : '') + '>' + esc(TYPES[k].name) + '</option>'; }).join('') + '</select></td>' +
        '<td class="w-kg"><input type="number" data-k="bew" step="1" value="' + a.bew + '"></td>' +
        '<td class="w-arm"><input type="number" data-k="arm" step="0.001" value="' + a.arm + '"></td>' +
        '<td><input type="text" data-k="note" value="' + esc(a.note || '') + '"></td>' +
        '<td><button type="button" class="icon" data-del="' + i + '" title="Remove">×</button></td></tr>';
    }).join('');
  }
  function saveFleet() {
    $('tblFleet').querySelectorAll('select[data-k=type]').forEach(function (s) { fleetDraft[+s.closest('tr').dataset.i].type = s.value; });
    var done = function (saved) {
      fleet = saved;
      var cur = fleet.filter(function (a) { return a.reg === state.reg; })[0] || fleet[0];
      state.reg = cur.reg; state.type = cur.type; state.bew = cur.bew; state.bewArm = cur.arm;
      clampFuel();
      $('fleetModal').hidden = true;
      renderAll();
      toast('Fleet saved.');
    };
    if (HAS_GAS) {
      $('btnFleetSave').disabled = true;
      google.script.run
        .withSuccessHandler(function (saved) { $('btnFleetSave').disabled = false; done(saved); })
        .withFailureHandler(function (err) { $('btnFleetSave').disabled = false; $('fleetMsg').textContent = err.message || String(err); })
        .saveFleet(fleetDraft);
    } else {
      var bad = fleetDraft.filter(function (a) { return !String(a.reg).trim() || !(a.bew > 3000 && a.bew < 6500) || !(a.arm > 5 && a.arm < 7); });
      if (bad.length || !fleetDraft.length) { $('fleetMsg').textContent = 'Each aircraft needs a registration, BEW 3000–6500 kg and arm 5–7 m.'; return; }
      try { localStorage.setItem('c212wb.fleet', JSON.stringify(fleetDraft)); } catch (e) {}
      done(fleetDraft.map(function (a) { return Object.assign({}, a); }));
    }
  }

  /* ============================ SAVE LOG ============================= */
  function saveLog() {
    if (!lastResult) return;
    var r = lastResult;
    var nBad = r.issues.filter(function (i) { return i.lvl === 'bad'; }).length;
    var rec = {
      date: state.date, flight: state.flight, mission: state.mission, reg: state.reg, typeName: r.t.name, pic: state.pic,
      bew: Math.round(state.bew), people: Math.round(r.peopleW), payload: Math.round(r.payW),
      zfw: Math.round(r.zfw.w), zfwCg: +f1(r.zfw.cg), fuel: Math.round(r.fuelTot),
      tow: Math.round(r.tow.w), towCg: +f1(r.tow.cg), trip: Math.round(r.trip),
      lw: Math.round(r.lw.w), lwCg: +f1(r.lw.cg),
      status: nBad ? 'OUTSIDE LIMITS' : 'WITHIN LIMITS',
      warnings: r.issues.map(function (i) { return i.msg; }).join(' | ')
    };
    if (!HAS_GAS) { toast('Saving to the log works when the app runs as a Google Apps Script web app.'); return; }
    $('btnSave').disabled = true;
    google.script.run
      .withSuccessHandler(function (res) {
        $('btnSave').disabled = false;
        toast('Saved to log (row ' + res.row + '). <a href="' + esc(res.url) + '" target="_blank" rel="noopener">Open sheet</a>', true);
      })
      .withFailureHandler(function (err) { $('btnSave').disabled = false; toast('Save failed: ' + esc(err.message || String(err)), true); })
      .saveLoadsheet(rec);
  }

  var toastTimer;
  function toast(msg, html) {
    var t = $('toast');
    if (html) t.innerHTML = msg; else t.textContent = msg;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, 6000);
  }

  /* ============================== INIT =============================== */
  state = rainState(fleet[0]);
  bind();
  renderAll();
  window.__c212 = { compute: compute, getState: function () { return state; }, TYPES: TYPES, placeItem: placeItem };
})();
</script>
