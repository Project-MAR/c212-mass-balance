name: Deploy to Google Apps Script

on:
  push:
    branches: [main]
    paths:
      - 'Code.gs'
      - '*.html'
      - 'appsscript.json'
      - '.claspignore'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: gas-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install clasp
        run: npm install -g @google/clasp@3.4.1

      - name: Write clasp credentials and project file
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
        run: |
          test -n "$CLASPRC_JSON" || { echo "::error::Secret CLASPRC_JSON is missing"; exit 1; }
          test -n "$SCRIPT_ID"   || { echo "::error::Secret SCRIPT_ID is missing"; exit 1; }
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          printf '{"scriptId":"%s","rootDir":"."}' "$SCRIPT_ID" > .clasp.json

      - name: Push code
        run: clasp push --force

      - name: Update web app deployment (keeps the same URL)
        env:
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
        run: |
          test -n "$DEPLOYMENT_ID" || { echo "::error::Secret DEPLOYMENT_ID is missing"; exit 1; }
          clasp update-deployment "$DEPLOYMENT_ID" --description "GitHub ${GITHUB_SHA::7} – $(date -u +%Y-%m-%dT%H:%MZ)"

      - name: Remove credentials
        if: always()
        run: rm -f "$HOME/.clasprc.json" .clasp.json
